<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Elpis</title>
  <link rel="icon" href="/assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="status-bar"><span id="clock">9:41</span><span class="status-icons">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8.5.6 10.2 10.2 0 0 0 1.4 3.5l1.1 1.2c1.6-1.5 3.7-2.4 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.1-1.2a6.8 6.8 0 0 0-9.4 0l1.1 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.4c.5 0 1 .2 1.3.5L8.5 11 7.2 9.6c.3-.3.8-.5 1.3-.5Z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4"/></svg>
  </span></div>

  <!-- Onboarding -->
  <section class="screen onboarding" id="onboarding" hidden>
    <img src="/assets/icon.svg" class="onboard-icon" alt="">
    <h1>Elpis</h1>
    <p>Before we begin, what should I call you?</p>
    <form id="onboard-form">
      <input id="name-input" autocomplete="given-name" placeholder="Your name" maxlength="40" required>
      <button class="pill-btn" type="submit">Begin</button>
    </form>
  </section>

  <!-- Chat -->
  <section class="screen chat" id="chat" hidden>
    <header class="chat-top">
      <span></span>
      <h2>Elpis</h2>
      <div class="top-actions">
        <button class="icon-btn" id="call-btn" aria-label="Call Elpis">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>
        </button>
        <button class="icon-btn" id="tools-btn" aria-label="Tools">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4.3 3.3a1 1 0 0 1 1.4 0L7 4.6l1.3-1.3a1 1 0 1 1 1.4 1.4L8.4 6l1.3 1.3a1 1 0 1 1-1.4 1.4L7 7.4 5.7 8.7a1 1 0 0 1-1.4-1.4L5.6 6 4.3 4.7a1 1 0 0 1 0-1.4Z"/><path d="M17 2.5 21 9h-8l4-6.5Z"/><circle cx="7" cy="17" r="4"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        </button>
      </div>
    </header>
    <div class="messages" id="messages" aria-live="polite"></div>
    <form class="composer" id="composer">
      <div class="type-area">
        <textarea id="input" rows="1" placeholder="Type your message here" aria-label="Message"></textarea>
        <button type="button" class="icon-btn mic" id="mic-btn" aria-label="Dictate">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="8.5" y="2" width="7" height="12.5" rx="3.5"/><path d="M5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0 1 1 0 1 1 2 0 7 7 0 0 1-6 6.9V21h2.5a1 1 0 1 1 0 2h-7a1 1 0 1 1 0-2H11v-3.1A7 7 0 0 1 5 11Z"/></svg>
        </button>
        <button type="button" class="icon-btn wave" id="voice-btn" aria-label="Talk with Elpis">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="3" y="9" width="2" height="6" rx="1"/><rect x="7" y="5" width="2" height="14" rx="1"/><rect x="11" y="2" width="2" height="20" rx="1"/><rect x="15" y="6" width="2" height="12" rx="1"/><rect x="19" y="9" width="2" height="6" rx="1"/></svg>
        </button>
        <button type="submit" class="send" id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 4.5 5.3 11.2a1 1 0 0 0 1.4 1.4L11 8.3V19a1 1 0 1 0 2 0V8.3l4.3 4.3a1 1 0 0 0 1.4-1.4L12 4.5Z"/></svg>
        </button>
      </div>
    </form>
  </section>

  <!-- Call -->
  <section class="screen call" id="call" hidden>
    <div class="call-timer" id="call-timer">0:00</div>
    <div class="call-name">Elpis</div>
    <img src="/assets/call-icon.svg" class="mascot" id="mascot" alt="">
    <div class="call-text" id="call-text"></div>
    <div class="listening" id="listening" hidden><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="call-controls">
      <div class="call-ctl"><button class="round speaker on" id="speaker-btn" aria-label="Speaker">
        <svg viewBox="0 0 32 32" width="34" height="34" fill="currentColor"><path d="M4 12h5l7-6v20l-7-6H4z"/><path d="M20 11.5a6 6 0 0 1 0 9" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M23.5 8a11 11 0 0 1 0 16" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      </button><span>Speaker</span></div>
      <div class="call-ctl"><button class="round end" id="end-btn" aria-label="End call">
        <svg viewBox="0 0 32 32" width="34" height="34" fill="currentColor"><path d="M16 12c-4.3 0-8.3 1.3-11.2 3.5-.8.6-1 1.7-.4 2.5l1.5 2c.5.7 1.5.9 2.3.5l3-1.6c.6-.3 1-1 .9-1.7l-.2-2c1.3-.4 2.7-.6 4.1-.6s2.8.2 4.1.6l-.2 2c-.1.7.3 1.4.9 1.7l3 1.6c.8.4 1.8.2 2.3-.5l1.5-2c.6-.8.4-1.9-.4-2.5C24.3 13.3 20.3 12 16 12Z"/></svg>
      </button><span>End</span></div>
    </div>
  </section>

  <!-- Breathe -->
  <section class="screen breathe" id="breathe" hidden>
    <button class="icon-btn close" id="breathe-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <canvas id="wave" width="393" height="300"></canvas>
    <div class="breathe-label" id="breathe-label">Breathe In</div>
    <div class="sounds" id="sounds">
      <button data-sound="music" aria-label="Music"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M9 17.5a2.5 2.5 0 1 1-2-2.45V5.8l10-2.3v11.95a2.5 2.5 0 1 1-2-2.45V7.1l-6 1.4v9Z"/></svg><span>Music</span></button>
      <button data-sound="waves" class="selected" aria-label="Waves"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0M3 12.5c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0M3 17c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/></svg><span>Waves</span></button>
      <button data-sound="rain" aria-label="Rain"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 6l-1.5 3M12 5l-1.5 3M17 6l-1.5 3M8.5 12 7 15M13.5 11 12 14M18 12l-1.5 3M10 17l-1.2 2.5M15 17l-1.2 2.5"/></svg><span>Rain</span></button>
    </div>
    <div class="sound-name" id="sound-name">Waves</div>
    <div class="breathe-controls">
      <button class="icon-btn" id="breathe-timer" aria-label="Session length"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13 8.5 9.5M10 2.5h4"/></svg><span id="breathe-mins">3 min</span></button>
      <button class="round play" id="breathe-play" aria-label="Pause"><svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor" id="play-icon"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
      <button class="icon-btn" id="breathe-mute" aria-label="Mute sound"><svg viewBox="0 0 32 32" width="32" height="32" fill="currentColor"><path d="M4 12h5l7-6v20l-7-6H4z"/><path id="mute-wave" d="M20 11.5a6 6 0 0 1 0 9" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button>
    </div>
    <div class="breathe-done" id="breathe-done" hidden>
      <img src="/assets/call-icon.svg" alt="">
      <p class="lead">Your breath is your own again.</p>
      <p>Whenever your body needs this, it's here.</p>
      <button class="pill-btn" id="breathe-back">Back to Elpis</button>
    </div>
  </section>

  <!-- Rest World -->
  <section class="screen restworld" id="restworld" hidden>
    <header class="rw-top">
      <button class="icon-btn close" id="rw-close" aria-label="Close"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </header>
    <h2>Rest World</h2>
    <p class="rw-sub">Little moments you chose to keep.</p>
    <div class="rw-grid" id="rw-grid"></div>
    <div class="rw-detail" id="rw-detail" hidden></div>
  </section>

  <!-- Bottom sheets -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="tools-sheet" hidden>
    <div class="grabber"></div>
    <button class="tool" data-tool="breathe"><span class="tool-ic">≋</span><span><b>Breathe</b><small>A slow, guided breath</small></span></button>
    <button class="tool" data-tool="restworld"><span class="tool-ic"><img src="/assets/icon.svg" alt=""></span><span><b>Rest World</b><small>The moments you kept</small></span></button>
    <button class="tool" data-tool="call"><span class="tool-ic">☏</span><span><b>Call Elpis</b><small>Talk instead of typing</small></span></button>
  </div>
  <div class="sheet journal" id="journal-sheet" hidden>
    <div class="grabber"></div>
    <img src="/assets/icon.svg" class="j-icon" alt="">
    <p class="j-prompt" id="j-prompt"></p>
    <textarea id="j-text" rows="4" placeholder="Write as little or as much as you like"></textarea>
    <button class="pill-btn solid" id="j-keep">Keep this memory</button>
    <button class="text-btn" id="j-cancel">Not now</button>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
